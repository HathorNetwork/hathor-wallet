# Frozen snapshot of hathor-wallet qa/sentry/graph.yaml (2026-10-29), kept as a regression fixture for the tools.
# The live graph is in that checkout; do not edit this copy to track it.
# Sentry QA graph for the desktop wallet, scoped to the Electron 42 /
# isolation / consent stack (HathorNetwork/hathor-wallet#901, #899, #903, #900,
# #905, #906; top: fix/preload-storage-race). Same schema as
# hathor-wallet-mobile's QA/graph/graph.yaml (see its QA/graph/README.md).
#
# Validate / render with the mobile tools:
#   node ../mobile-wallet/QA/graph/tools/cli.js validate --graph qa/sentry/graph.yaml
#   node ../mobile-wallet/QA/graph/tools/cli.js render --graph qa/sentry/graph.yaml --out qa/sentry/dist/graph.html
#
# Where to look during a run (qa/sentry/README.md has the full setup):
#   SINK     the terminal running `node qa/sentry/sentry-sink.mjs`
#   CONSENT  cat ~/Library/Application\ Support/Hathor\ Wallet/sentry-consent.json
#   PAGE     the renderer DevTools console (Debug > Open DevTools, Cmd+B)
#   MAIN     the main-process inspector (chrome://inspect > "Hathor Wallet" / electron, port 5858)
#   LOG      the Terminal the wallet was launched from (main's console.* output)
version: 1
costs: { cheap: 1, medium: 5, expensive: 20, very-expensive: 60 }

environments:
  - id: mac-local-sink
    name: Mac, Sentry pointed at the local sink
    notes: The wallet is launched from Terminal with SENTRY_DSN=http://qa@127.0.0.1:9876/1 and `node qa/sentry/sentry-sink.mjs` running, so nothing leaves the machine and every envelope is counted. Main and preload read SENTRY_DSN at run time (public/constants.js); the renderer bundle never sees the DSN on this stack.
  - id: mac-sentry-io
    name: Mac, real sentry.io project
    notes: No SENTRY_DSN override, so events go to the real project (constants.SENTRY_DSN). Checks the path the local sink cannot see. The request leaves through Electron's net module on the default session with the Brotli guard installed, and sentry.io has to accept what the 3.0.7 SDK sends from Electron 42. Prefix every manual message with `qa-<your initials>-` so the events can be found and resolved. # QA: confirm whether a staging DSN should be used instead of the production project

features:
  - id: consent-ui
    name: Consent screens and settings
    description: The user grants or revokes automatic bug reports in Settings > "Automatically report bugs to Hathor" > Change (the /permission screen); "Get started" on Welcome sets it to No.
    status: in-scope
    screens: [Settings, SentryPermission, Welcome, WalletType, LockedWallet]
    files:
      - src/screens/SentryPermission.js
      - src/screens/Settings.js
      - src/screens/Welcome.js
      - src/screens/WalletType.js
      - src/screens/LockedWallet.js
      - src/utils/wallet.js
    flags: []
    links:
      - { to: preload-consent, reason: 'Every allow/disallow ends in electronAPI.sentrySetEnabled, which the preload applies' }
    introduces: []
    actions: [toggle-consent, onboarding-get-started]

  - id: preload-consent
    name: Preload Sentry client and startup sync
    description: The preload's @sentry/electron client starts disabled, reads localStorage 'wallet:sentry' on load and flips its live `enabled` option, and reports the value to main on every load and change.
    status: in-scope
    screens: []
    files:
      - public/preload.js
      - public/bridge.js
    flags: []
    links:
      - { to: main-consent, reason: applySentryConsent sends every change to main over sentry:consent }
    introduces: ['install:legacy-hw']
    actions: [startup-step-failure, bridge-probe]

  - id: main-consent
    name: Main-process consent store and gated transport
    description: Main keeps its own copy of the choice in <userData>/sentry-consent.json, reads it before Sentry.init, and refuses every request (events, sessions, minidumps, offline-queue retries) at the transport without consent. A revoke waits for in-flight reports to flush.
    status: in-scope
    screens: []
    files:
      - public/sentryConsent.js
      - public/electron.js
    flags: []
    links: []
    introduces: ['install:upgrade']
    actions: [launch-quit, main-crash, offline-queue]

  - id: page-error-forwarding
    name: Page error forwarding
    description: With context isolation the preload SDK cannot see page errors, so src/utils/wallet.js forwards window 'error' and 'unhandledrejection' through electronAPI.sentryCapture, deduped per error object.
    status: in-scope
    screens: []
    files:
      - src/utils/wallet.js
      - src/index.js
      - src/constants.js
    flags: []
    links:
      - { to: preload-consent, reason: sentryCapture is dropped by the preload client unless consent is on }
    introduces: []
    actions: [page-error, ipc-listener-error]

  - id: crash-modal
    name: Unhandled-error modal
    description: An uncaught page error opens the "Unexpected error" modal; when the user has not opted in it offers "Send error report to help the developers", which grants, captures and revokes in one tick.
    status: in-scope
    screens: [ModalUnhandledError]
    files:
      - src/ErrorWrapper.js
      - src/components/ModalUnhandledError.js
    flags: []
    links:
      - { to: page-error-forwarding, reason: The report is sent through sentryWithScope over the bridge }
      - { to: main-consent, reason: The revoke must wait for main to flush the report it just received }
    introduces: []
    actions: [crash-modal-report]

  - id: native-crash
    name: Native crash reporting (Crashpad minidumps)
    description: Renderer and main native crashes produce a minidump that main's SDK uploads at crash time or at the next start, gated by the stored consent.
    status: in-scope
    screens: []
    files:
      - public/electron.js
      - public/sentryConsent.js
    flags: []
    links:
      - { to: main-consent, reason: Uploads go through the gated transport and use the consent stored by the previous run }
    introduces: []
    actions: [main-crash]

  - id: data-reset
    name: Data and wallet reset
    description: Debug > "Reset all data" clears localStorage and revokes main's copy; Settings / crash-modal / locked-screen "Reset wallet" keeps 'wallet:sentry' until "Get started" sets it to No.
    status: in-scope
    screens: [ModalConfirmClearStorage, Settings, Welcome]
    files:
      - src/App.js
      - src/components/ModalConfirmClearStorage.js
      - src/sagas/wallet.js
      - src/storage.js
    flags: []
    links:
      - { to: main-consent, reason: app:clear_storage_success revokes main's copy }
      - { to: consent-ui, reason: "After a wallet reset, Get started is what turns consent off" }
    introduces: []
    actions: [reset-data]

  - id: external-url
    name: External URL refusal
    description: openExternal refuses non-http(s) URLs; the refusal is caught so it neither opens the crash modal nor reaches Sentry.
    status: in-scope
    screens: [Navigation, NetworkSettings]
    files:
      - src/utils/helpers.js
      - src/components/NetworkSettingsForm.js
      - public/bridge.js
    flags: []
    links:
      - { to: page-error-forwarding, reason: An uncaught refusal would be forwarded as a page error }
    introduces: []
    actions: [external-url]

  - id: noise
    name: Event volume in normal use
    description: What reaches Sentry during ordinary use with consent on, now that every uncaught page error and rejection is forwarded (wallet-lib network rejections, LavaMoat policy errors, ResizeObserver notices).
    status: in-scope
    screens: [Dashboard, SendTokens, Settings]
    files:
      - src/utils/wallet.js
      - public/brotliGuard.js
    flags: []
    links:
      - { to: page-error-forwarding, reason: The volume is decided by what reportPageError forwards }
    introduces: []
    actions: [smoke-noise]

  - id: ledger-ipc
    name: Ledger IPC through the bridge
    description: Ledger replies arrive through the allowlisted bridge; a throwing listener is re-dispatched to the page so it reaches the modal and Sentry.
    status: out-of-scope
    screens: [StartHardwareWallet, SendTokens]
    files:
      - src/constants.js
      - public/bridge.js
      - public/ledger.js
    flags: []
    links:
      - { to: page-error-forwarding, reason: Re-dispatched listener errors are forwarded like any page error }
    # Real-device Ledger flows are QA_LEDGER.md; here only the error path is covered, simulated from MAIN.
    introduces: []
    actions: [ipc-listener-error]

flags: []

axes:
  # Setup axes
  - id: build
    name: How the app is run
    kind: setup
    values:
      - { id: unpacked, name: 'Production bundle, unpacked (electron .)' }
      - { id: packaged, name: Packaged .app }
    how: 'unpacked: `npm ci && npm run build-css && npm run build`, then `SENTRY_DSN=... npx electron --inspect=5858 . --unsafe-mode --hathor-debug`. LavaMoat bundle, Debug menu and main inspector available. packaged: `npm run electron-pack-mac` (signing off, README "Packaged build"), then run `"/path/Hathor Wallet.app/Contents/MacOS/Hathor Wallet" --unsafe-mode --hathor-debug` from Terminal so SENTRY_DSN reaches it.'
    switch:
      cost: expensive
      transitions:
        - { from: packaged, to: unpacked, cost: medium, when: build/ is already up to date }

  - id: install
    name: What userData the run starts from
    kind: setup
    values:
      - { id: fresh, name: Fresh userData (never run) }
      - { id: upgrade, name: 'Upgraded from v0.35.0 (localStorage consent, no sentry-consent.json)' }
      - { id: legacy-hw, name: Seeded <= v0.26 hardware-wallet localStorage }
    how: 'fresh: quit, `mv ~/Library/Application\ Support/Hathor\ Wallet{,.bak-$(date +%s)}`. upgrade: fresh, then run the v0.35.0 release (or master) once, onboard and set the consent, quit, then launch the stack build on the same userData. legacy-hw: on any build, in PAGE run `localStorage.setItem(''wallet:accessData'', JSON.stringify({from_xpub: true})); localStorage.setItem(''wallet:type'', ''hardware'')`, keep wallet:sentry as the setup needs, quit, relaunch.'
    switch:
      cost: medium
      transitions:
        - { from: fresh, to: upgrade, cost: expensive, when: needs the old build installed next to the stack build }
        - { from: legacy-hw, to: upgrade, impossible: true, when: the legacy migration has already cleared localStorage }
      fallback: { cost: expensive, how: move userData away (fresh) and redo the setup }

  - id: launch-consent
    name: Consent stored when the app starts
    kind: setup
    values:
      - { id: none, name: 'Never set (no wallet:sentry, no sentry-consent.json)' }
      - { id: in, name: Opted in }
      - { id: out, name: Opted out }
    how: Settings > "Automatically report bugs to Hathor" > Change > tick or untick "I allow Hathor Wallet to report error information to Hathor team." > Continue, then quit with Cmd+Q and relaunch. `none` only exists before "Get started" on a fresh userData.
    switch:
      cost: cheap
      transitions:
        - { from: in, to: none, cost: medium, when: move userData away; there is no way back to "never set" in the UI }
        - { from: out, to: none, cost: medium, when: move userData away }

  - id: sink
    name: Where Sentry sends
    kind: setup
    values:
      - { id: local, name: Local sink }
      - { id: sentry-io, name: Real sentry.io }
    how: Launch with or without SENTRY_DSN=http://qa@127.0.0.1:9876/1. Changing it needs a relaunch.
    switch:
      cost: cheap

  # Action axes
  - id: quit
    name: How the app is left
    kind: action
    values:
      - { id: cmd-q, name: Cmd+Q / app menu Quit }
      - { id: tray-exit, name: Menu-bar tray icon > Exit (app.exit) }
      - { id: window-close, name: Red close button (window hides to tray) }
      - { id: dock-quit, name: Dock icon > Quit }
    how: Pick one per scenario; window-close is not a quit, so follow it with the dock icon (reopens the window) or Cmd+Q.
    switch: { cost: cheap }

  - id: error-kind
    name: Kind of page error
    kind: action
    values:
      - { id: throw, name: 'Uncaught throw: setTimeout(() => { throw new Error(''qa-page-throw'') })' }
      - { id: reject-error, name: 'Unhandled rejection with an Error: Promise.reject(new Error(''qa-page-reject''))' }
      - { id: reject-string, name: 'Unhandled rejection with a string: Promise.reject(''qa-page-reject-str'')' }
      - { id: errorless, name: 'Error event without an error object: window.dispatchEvent(new ErrorEvent(''error'', { message: ''qa-errorless'' }))' }
      - { id: same-twice, name: 'Same Error object rejected twice: e = new Error(''qa-dup''); Promise.reject(e); Promise.reject(e)' }
    how: Type the snippet in PAGE (top context, not the preload's isolated world).
    switch: { cost: cheap }

  - id: clicks
    name: Clicks on "Send error report"
    kind: action
    values:
      - { id: once, name: Once }
      - { id: twice, name: Twice quickly }
    how: The button stays on screen after the first click.
    switch: { cost: cheap }

  - id: toggle
    name: Consent change
    kind: action
    values:
      - { id: in-to-out, name: Yes to No }
      - { id: out-to-in, name: No to Yes }
      - { id: unchanged, name: Continue without changing the box }
    how: On the /permission screen from Settings.
    switch: { cost: cheap }

  - id: crash
    name: Kind of crash
    kind: action
    values:
      - { id: renderer-native, name: 'Renderer native crash: MAIN `process.mainModule.require(''electron'').webContents.getAllWebContents()[0].forcefullyCrashRenderer()`' }
      - { id: main-exception, name: 'Main JS exception: MAIN `setTimeout(() => { throw new Error(''qa-main-throw'') })`' }
      - { id: main-native, name: 'Main native crash: MAIN `process.crash()`' }
    how: In the main-process inspector. If `process.mainModule` is undefined, use `module.require` or open public/electron.js in Sources and run it paused there. # QA: confirm the console form that works on Electron 42
    switch: { cost: cheap }

  - id: relaunch-consent
    name: Consent when the app is relaunched after the crash
    kind: action
    values:
      - { id: same, name: Unchanged }
      - { id: flipped, name: Flipped in Settings right after relaunch }
    how: After relaunch, check SINK first, then optionally flip the consent in Settings.
    switch: { cost: cheap }

  - id: retry-consent
    name: Consent when the offline queue retries
    kind: action
    values:
      - { id: in, name: Still opted in }
      - { id: out, name: Opted out while offline }
    how: With Wi-Fi off, change the consent in Settings before reconnecting.
    switch: { cost: cheap }

  - id: reset-kind
    name: Kind of reset
    kind: action
    values:
      - { id: reset-all-data, name: Debug > Reset all data }
      - { id: settings-reset-wallet, name: Settings > Reset wallet }
      - { id: modal-reset-wallet, name: Crash modal > Reset wallet }
    how: The crash modal is opened by an error-kind throw from PAGE.
    switch: { cost: cheap }

  - id: probe
    name: Bridge probe from the page
    kind: action
    values:
      - { id: send-consent-channel, name: 'electronAPI.send(''sentry:consent'', true)' }
      - { id: set-enabled-string, name: 'electronAPI.sentrySetEnabled(''true'')' }
      - { id: capture-direct, name: 'electronAPI.sentryCapture({ message: ''qa-bridge-capture'' })' }
      - { id: require-gone, name: 'typeof window.require' }
    how: Type in PAGE.
    switch: { cost: cheap }

  - id: step
    name: Preload startup step made to fail
    kind: action
    values:
      - { id: systray, name: "syncSystrayMessage (last step): localStorage.setItem('wallet:systray_message_checked', '{bad')" }
      - { id: legacy, name: "clearLegacyHardwareData (first step, before consent is read): localStorage.setItem('wallet:accessData', '{bad')" }
    how: Set the value in PAGE, then reload with `location.reload()` (the preload runs again). Undo with removeItem / setItem('...', 'false') afterwards.
    switch: { cost: cheap }

  - id: flow
    name: Flow walked
    kind: action
    values:
      - { id: onboarding, name: Welcome > new software wallet > home }
      - { id: send, name: 'Send Tokens screen, fill and send (testnet)' }
      - { id: network-drop, name: 'Wallet loaded, then Wi-Fi off for 60 s and back on' }
      - { id: settings-tour, name: 'Settings, Network Settings, Address Mode, Custom tokens' }
    how: Mark the start in SINK (`m smoke:<flow>`) and count the envelopes it produces.
    switch: { cost: cheap }

setups:
  - id: fresh-none
    name: Unpacked, fresh userData, consent never set, local sink
    values: { build: unpacked, install: fresh, launch-consent: none, sink: local }
    environment: mac-local-sink
    runnable: true
    notes: Run first. Consent file must not exist until "Get started".
  - id: fresh-in
    name: Unpacked, opted in, local sink
    values: { build: unpacked, install: fresh, launch-consent: in, sink: local }
    environment: mac-local-sink
    runnable: true
  - id: fresh-out
    name: Unpacked, opted out, local sink
    values: { build: unpacked, install: fresh, launch-consent: out, sink: local }
    environment: mac-local-sink
    runnable: true
  - id: upgrade-in
    name: Unpacked, upgraded from v0.35.0 while opted in, local sink
    values: { build: unpacked, install: upgrade, launch-consent: in, sink: local }
    environment: mac-local-sink
    runnable: true # QA: confirm the v0.35.0 build is installed on the Mac
    notes: The v0.35.0 run uses the real DSN baked into its bundle, so keep it short and quit; nothing it sends is part of the test.
  - id: upgrade-out
    name: Unpacked, upgraded from v0.35.0 while opted out, local sink
    values: { build: unpacked, install: upgrade, launch-consent: out, sink: local }
    environment: mac-local-sink
    runnable: true # QA: confirm
  - id: legacy-in
    name: Unpacked, seeded legacy hardware data while opted in, local sink
    values: { build: unpacked, install: legacy-hw, launch-consent: in, sink: local }
    environment: mac-local-sink
    runnable: true
    notes: The migration wipes localStorage, consent included, so the run must end opted out.
  - id: pkg-in
    name: Packaged .app, opted in, local sink
    values: { build: packaged, install: fresh, launch-consent: in, sink: local }
    environment: mac-local-sink
    runnable: true # QA: confirm the .app builds without the signing keys
    notes: Crashpad and the preload path inside app.asar are only realistic here.
  - id: pkg-out
    name: Packaged .app, opted out, local sink
    values: { build: packaged, install: fresh, launch-consent: out, sink: local }
    environment: mac-local-sink
    runnable: true # QA: confirm
  - id: io-in
    name: Packaged .app, opted in, real sentry.io
    values: { build: packaged, install: fresh, launch-consent: in, sink: sentry-io }
    environment: mac-sentry-io
    runnable: true # QA: confirm access to the Sentry project
    notes: Proves events, sessions and a minidump reach sentry.io through the Brotli guard; check the Sentry Issues and Releases pages, not a sink.

actions:
  - id: launch-quit
    name: Launch, idle, quit
    feature: main-consent
    axes: []
    setups: [fresh-none, fresh-in, fresh-out, upgrade-in, upgrade-out, legacy-in, pkg-in, pkg-out, io-in]
    path:
      steps:
        - { id: launch, screen: LockedWallet, name: Launch from Terminal with the setup's SENTRY_DSN; wait for the screen }
        - { id: inspect, screen: LockedWallet, name: Check CONSENT and LOG (no Sentry error from main or preload on Electron 42) }
        - { id: quit, screen: LockedWallet, name: Cmd+Q }
      outcomes:
        - id: ok-follows-consent
          kind: success
          at: quit
          message: 'Opted in: one session(status=exited, release=0.35.0) at quit. Opted out or never set: no envelope from launch to quit'
          source: 'public/sentryConsent.js:86'
          verified: false
        - id: ok-consent-file
          kind: success
          at: inspect
          message: 'Opted in: CONSENT is {"enabled":true} once the window has loaded. Opted out or never set: CONSENT is absent unless consent was revoked earlier, then {"enabled":false} (a value equal to the stored one is never written)'
          source: 'public/sentryConsent.js:30'
          verified: false
        - id: err-legacy-wiped
          kind: error
          at: inspect
          message: The app opens on Welcome / wallet type and CONSENT reads {"enabled":false}; nothing in SINK
          source: 'public/preload.js:72'
          verified: false
          note: Expected for legacy-in. Opted-in users coming from <= v0.26 hardware wallets silently lose their consent, which master did too.

  - id: quit-methods
    name: Quit methods, opted in
    feature: main-consent
    axes: [quit]
    setups: [fresh-in, pkg-in]
    path:
      steps:
        - { id: launch, screen: LockedWallet, name: Launch and unlock }
        - { id: quit, screen: Dashboard, name: Leave the app with the scenario's quit method }
        - { id: relaunch, screen: LockedWallet, name: Relaunch and wait 30 s }
      outcomes:
        - id: ok-session-exited
          kind: success
          at: quit
          message: One session(status=exited) at quit, nothing extra at relaunch
          source: 'public/electron.js:37'
          verified: false
        - id: edge-tray-exit-no-session
          kind: error
          at: quit
          message: No session envelope at quit (app.exit skips the quit events); the session may arrive as abnormal at the next launch
          source: 'public/electron.js:266'
          verified: false
        - id: edge-window-close-hides
          kind: error
          at: quit
          message: The "Your Hathor Wallet has not been closed" dialog shows and no session is sent; reopening from the Dock sends nothing new
          source: 'public/electron.js:185'
          verified: false

  - id: onboarding-get-started
    name: Welcome > Get started
    feature: consent-ui
    axes: []
    setups: [fresh-none, fresh-in, upgrade-in]
    path:
      steps:
        - { id: welcome, screen: Welcome, name: 'On Welcome (for fresh-in / upgrade-in, reach it through Settings > Reset wallet), tick the terms box' }
        - { id: start, screen: Welcome, name: Click "Get started" }
        - { id: settings, screen: Settings, name: Finish onboarding and open Settings }
      outcomes:
        - id: ok-starts-opted-out
          kind: success
          at: settings
          message: 'Settings shows "Automatically report bugs to Hathor: No"; CONSENT is {"enabled":false}; SINK empty'
          source: 'src/screens/Welcome.js:45'
          verified: false
        - id: edge-opt-in-lost
          kind: error
          at: start
          message: A previously opted-in user (reached Welcome through Reset wallet) ends opted out with no prompt
          source: 'src/screens/Welcome.js:45'
          verified: false
          note: Unchanged from master; record it, it is not a regression of the stack.

  - id: toggle-consent
    name: Change consent in Settings
    feature: consent-ui
    axes: [toggle]
    setups: [fresh-in, fresh-out, pkg-in]
    path:
      steps:
        - { id: open, screen: Settings, name: 'Settings > "Automatically report bugs to Hathor:" > Change' }
        - { id: choose, screen: SentryPermission, name: Set the box as the scenario says and click "Continue" }
        - { id: verify, screen: Settings, name: 'Check Settings, CONSENT, then throw a page error (error-kind throw) and check SINK' }
        - { id: relaunch, screen: LockedWallet, name: 'Cmd+Q, relaunch, unlock, throw again' }
      outcomes:
        - id: ok-applied-live
          kind: success
          at: verify
          message: Settings shows the new Yes/No, CONSENT matches at once, and the throw is in SINK only when Yes
          source: 'src/utils/wallet.js:464'
          verified: false
        - id: ok-survives-relaunch
          kind: success
          at: relaunch
          message: After relaunch the same three agree, and a main-exception crash follows the same consent
          source: 'public/preload.js:58'
          verified: false
        - id: edge-revoke-flush-wait
          kind: error
          at: verify
          message: 'Yes to No: CONSENT flips only after main flushes (up to 2 s, longer offline); an event thrown in that window can still be sent'
          source: 'public/sentryConsent.js:58'
          verified: false

  - id: page-error
    name: Uncaught page error
    feature: page-error-forwarding
    axes: [error-kind]
    setups: [fresh-none, fresh-in, fresh-out, pkg-in, io-in]
    path:
      steps:
        - { id: run, screen: Dashboard, name: 'Mark SINK, then type the error-kind snippet in PAGE' }
        - { id: modal, screen: ModalUnhandledError, name: Note whether the "Unexpected error" modal opens; close it with "Go to home" }
        - { id: sink, screen: Dashboard, name: Wait 5 s and read SINK }
      outcomes:
        - id: ok-sent-once
          kind: success
          at: sink
          message: 'Opted in: exactly one event with extra source=window.error (throw) or unhandledrejection (rejections); nothing when opted out or never set'
          source: 'src/utils/wallet.js:522'
          verified: false
        - id: ok-modal-on-throw
          kind: success
          at: modal
          message: The modal opens for throw only; rejections open no modal
          source: 'src/ErrorWrapper.js:30'
          verified: false
        - id: edge-errorless-no-modal
