constraints:
  - id: c-toggle-unchanged
    action: toggle-consent
    when: { toggle: unchanged }
    class: edge
    outcome: ok-applied-live
    note: Continue without a change still calls allow/disallow, re-sending the value; a revoke still waits for a flush.
  - id: c-modal-opted-in
    action: crash-modal-report
    when: { launch-consent: in }
    class: edge
    outcome: edge-button-hidden-opted-in
    note: The rest of the path is not reachable when opted in.
  - id: c-double-click
    action: crash-modal-report
    when: { clicks: twice }
    class: edge
    outcome: edge-double-click
    note: Nothing debounces the button.
  - id: c-errorless
    action: page-error
    when: { error-kind: errorless }
    class: edge
    outcome: edge-errorless-no-modal
    note: ResizeObserver-style notices.
  - id: c-dedupe
    action: page-error
    when: { error-kind: same-twice, launch-consent: in }
    class: edge
    outcome: edge-dedupe
    note: WeakSet in reportPageError.
  - id: c-string-reason
    action: page-error
    when: { error-kind: reject-string, launch-consent: in }
    class: edge
    outcome: edge-string-reason
    note: Non-Error reasons are wrapped.
  - id: c-tray-exit
    action: quit-methods
    when: { quit: tray-exit }
    class: edge
    outcome: edge-tray-exit-no-session
    note: Whether @sentry/electron 3.0.7 ends the session on app.exit() is SDK behaviour; record what happens.
  - id: c-window-close
    action: quit-methods
    when: { quit: window-close }
    class: edge
    outcome: edge-window-close-hides
    note: With the tray on, close hides the window.
  - id: c-legacy
    action: launch-quit
    when: { install: legacy-hw }
    class: edge
    outcome: err-legacy-wiped
    note: clearLegacyHardwareData runs before syncSentryConsent on purpose.
  - id: c-upgrade-first-crash
    action: main-crash
    when: { install: upgrade, crash: main-native }
    class: edge
    outcome: edge-upgrade-first-crash
    note: Only on the very first stack launch; crash before the window loads to hit it (run the snippet in MAIN as soon as the inspector attaches).
  - id: c-renderer-dead
    action: main-crash
    when: { crash: renderer-native }
    class: edge
    outcome: edge-renderer-dead-window
    note: Observe and record; the app has no renderer-gone handler.
  - id: c-crash-sdk
    action: main-crash
    when: { build: packaged }
    class: lib-risk
    note: '@sentry/electron 3.0.7 is old for Electron 42; native crash capture (Crashpad paths, the SDK''s injected preload) is where it could break silently.'
  - id: c-offline-revoke
    action: offline-queue
    when: { retry-consent: out }
    class: edge
    outcome: edge-revoke-waits-offline
    note: The flush before a revoke has a 2 s timeout.
  - id: c-reset-wallet
    action: reset-data
    when: { reset-kind: [settings-reset-wallet, modal-reset-wallet] }
    class: edge
    outcome: edge-reset-wallet-keeps-consent
    note: Pre-existing behaviour, recorded so nobody files it as a regression.
  - id: c-step-legacy
    action: startup-step-failure
    when: { step: legacy, launch-consent: in }
    class: edge
    outcome: edge-first-step-unreported
    note: The client is enabled only by the second step.
  - id: c-network-noise
    action: smoke-noise
    when: { flow: network-drop }
    class: edge
    outcome: edge-network-rejections
    note: Feeds the filtering decision.
