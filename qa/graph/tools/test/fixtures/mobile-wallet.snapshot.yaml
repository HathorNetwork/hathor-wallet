    flags: []

  - id: push-notifications
    name: Push notifications
    description: The user turns on push notifications for new transactions and opens a transaction from a notification.
    status: out-of-scope
    screens: [PushNotification]
    files:
      - src/screens/PushNotification.js
      - src/sagas/pushNotification.js
      - src/workers/
      - src/components/AskForPushNotification.js
      - src/components/AskForPushNotificationRefresh.js
      - src/components/PushTxDetailsModal.js
      - src/components/ShowPushNotificationTxDetails.js
