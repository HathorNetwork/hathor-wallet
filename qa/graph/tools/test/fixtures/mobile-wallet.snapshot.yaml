      - src/screens/Reown/GetAddressRequestScreen.js
      - src/screens/Reown/GetAddressClientRequestScreen.js
      - src/screens/Reown/GetUtxosRequestScreen.js
      - src/screens/Reown/SendTransactionRequestScreen.js
      - src/screens/Reown/SignOracleDataRequestScreen.js
