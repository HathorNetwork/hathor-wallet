  - id: lock-screen
    name: App lock
    description: The app asks for the PIN again after it was in the background for a while.
    status: out-of-scope
    screens: [PinScreen]
    files: []
    flags: []
    links:
      - { to: pin-unlock, reason: The app lock uses the same PIN screen }

  - id: passkey-lock
    name: Passkey lock screen
    description: A passkey wallet is unlocked with the passkey after the app was in the background.
    status: out-of-scope
    screens: []
    files:
      - src/screens/PasskeyLockScreen.js
    flags: []
    links:
      - { to: passkey-onboarding, reason: Only a passkey wallet has a passkey lock }

  - id: privacy-settings
    name: Privacy settings and key export
    description: On the shielded testnet, the user sets the default privacy mode and exports the audit keys.
    status: out-of-scope
    screens: [PrivacySettings, ExportPrivacyKeys]
