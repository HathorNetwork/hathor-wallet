  - id: amount-format
    name: Amount format
    description: The user picks how amounts are formatted (decimal and thousands separators).
    status: out-of-scope
    screens: [AmountFormat]
    files:
      - src/screens/AmountFormat.js
    flags: [amount-format]

  - id: settings
    name: Settings menu
    description: The settings tab lists the wallet's settings and shows only the entries whose flags are on.
    status: out-of-scope
    screens: [Settings]
    files:
      - src/screens/Settings.js
