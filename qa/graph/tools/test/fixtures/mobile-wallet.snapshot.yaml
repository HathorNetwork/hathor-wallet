# Frozen snapshot of hathor-wallet-mobile QA/graph/graph.yaml at baa28a00 (feat/qa-feature-graph), kept as a
# regression fixture for the tools. The live graph is in that repo; do not edit this copy to track it.
version: 1
costs: { cheap: 1, medium: 5, expensive: 20, very-expensive: 60 }

environments:
  - id: testnet
    name: Public testnet
    notes: The default public test network; where most manual and future automated tests run.
  - id: testnet-shielded
    name: Shielded testnet (testnet-shielded-outputs)
    notes: The test network with shielded outputs; the only network where the shielded UI, private sends and private receive addresses appear. Reached through the Shielded Testnet preset in Network Settings.
  - id: local-privnet
    name: Local privnet (mobile-e2e-flows)
    notes: A local fullnode and `sender` wallet from `../mobile-e2e-flows`, driven by Maestro on an Android emulator; for large amounts, edge cases and potentially breaking behaviour. Flags are forced on by editing `FEATURE_TOGGLE_DEFAULTS` locally (marked `E2E-LOCAL`), not through Unleash.
  - id: store-device
    name: Store build on a physical device
    notes: The App Store or Play Store build on a real phone; for what only manual QA can verify (passkeys, biometrics, push, camera).

features:
  # In scope (v1 core money paths and what they depend on)
  - id: send
    name: Send tokens
    description: The user sends HTR or a custom token to an address, typed or scanned, and confirms it.
    status: in-scope
    screens: [Send, SendAddressInput, SendScanQRCode, SendAmountInput, ChangeToken, SendConfirmScreen]
    files:
      - src/screens/SendAddressInput.js
      - src/screens/SendScanQRCode.js
      - src/screens/SendAmountInput.js
      - src/screens/ChangeToken.js
      - src/screens/SendConfirmScreen.js
      - src/components/TokenSelect.js
      - src/components/AmountTextInput.js
      - src/components/SendTransactionFeedbackModal.js
    flags: []
    links:
      - { to: pin-unlock, reason: The confirm screen asks for the PIN (or a passkey) before the send goes out }
      - { to: token-register, reason: Only registered tokens can be picked to send }
    # Fee tokens, private sends and the facade reach send via axis (token, privacy, dest, facade), not via code.
    introduces: []
    actions: [send]

  - id: shielded-send
    name: Private send
    description: On the shielded testnet, the user picks a privacy mode (public, hide amount, private) and sends to a shielded address.
    status: in-scope
    screens: [SendAmountInput, SendConfirmScreen]
    files:
      - src/utils/shieldedSend.js
      - src/shielded/fees.js
      - src/components/TransactionPrivacyModal.js
      - src/components/PrivacyModeSelector.js
      - src/components/PrivacyModeCard.js
      - src/components/Shielded/FeeBreakdown.js
    flags: [shielded-outputs]
    links:
      - { to: send, reason: Runs inside the send screens; any change there changes the private send }
      - { to: shielded, reason: Needs the private balance unlocked and the shielded provider registered }
      - { to: pin-unlock, reason: On the fullnode facade a locked private balance is unlocked with the PIN or passkey before sending }
      - { to: privacy-settings, reason: The default privacy mode set in privacy settings preselects the send's mode }
    introduces: ['privacy:hide-amount', 'privacy:private', 'dest:shielded', 'amount:private-over-limit']
    # Exercised by send only on the values it introduces, so it owns no whole action.
    actions: []

  - id: token-create
    name: Create token
    description: The user creates a new token by naming it, choosing a symbol and amount, and paying the deposit or fee.
    status: in-scope
    screens: [CreateTokenStack, CreateTokenTypeNotice, CreateTokenDepositNotice, CreateTokenName, CreateTokenSymbol, CreateTokenAmount, CreateTokenConfirm, CreateTokenDetail]
    files:
      - src/screens/CreateTokenTypeNotice.js
      - src/screens/CreateTokenDepositNotice.js
      - src/screens/CreateTokenName.js
      - src/screens/CreateTokenSymbol.js
      - src/screens/CreateTokenAmount.js
      - src/screens/CreateTokenConfirm.js
      - src/screens/CreateTokenDetail.js
    flags: [fee-based-tokens, shielded-outputs]
    links:
      - { to: fee-tokens, reason: The fee-based tokens flag decides whether the user can pick a fee token instead of a deposit token }
      - { to: token-register, reason: A created token is registered in the wallet automatically }
      - { to: pin-unlock, reason: The confirm screen asks for the PIN (or a passkey) }
      - { to: shielded, reason: On the shielded testnet the minted amount can go to a shielded address }
    introduces: []
    actions: [create-token]

  - id: fee-tokens
    name: Fee-based tokens
    description: Tokens that charge a small HTR fee on every transfer instead of locking an HTR deposit at creation.
    status: in-scope
    screens: [CreateTokenTypeNotice]
    files:
      - src/screens/CreateTokenTypeNotice.js
      - src/components/TxFeesRow.js
      - src/components/TokenDetails.js
    flags: [fee-based-tokens]
    # Send and history reach fee tokens via axis (token = fee), not via code.
    links: []
    introduces: ['token:fee']
    actions: [create-token]

  - id: receive
    name: Receive
    description: The user sees the wallet's current address as text and QR code, copies or shares it, and can ask for a new one.
    status: in-scope
    screens: [Receive]
    files:
      - src/screens/Receive.js
      - src/components/ReceiveMyAddress.js
    flags: []
    links:
      - { to: address-mode, reason: In single-address mode the address never changes and no new one can be generated }
      - { to: shielded-receive, reason: On the shielded testnet the screen also shows the private receive address }
    introduces: []
    actions: [receive]

  - id: shielded-receive
    name: Private receive address
    description: On the shielded testnet, the receive screen shows a shielded address that other wallets can send private amounts to.
    status: in-scope
    screens: [Receive]
    files:
      - src/components/Shielded/PrivateReceiveAddress.js
      - src/shielded/newAddress.js
      - src/shielded/receiveState.js
    flags: [shielded-outputs]
    links:
      - { to: shielded, reason: Needs the shielded provider registered and an unused shielded address on the wallet service }
      - { to: address-mode, reason: Shielded addresses are not supported in single-address mode }
      - { to: receive, reason: Shown inside the receive screen }
    introduces: []
    actions: [receive]

  - id: address-mode
    name: Address mode
    description: The user chooses between one fixed address (single) and a new address after each receive (multi).
    status: in-scope
    screens: [AddressMode]
    files:
      - src/screens/AddressMode.js
    flags: [single-address]
    links:
      - { to: shielded, reason: An active shielded chain keeps the wallet in multi-address mode }
      - { to: wallet-load, reason: Changing the mode reloads the wallet }
    introduces: ['addr:single']
    actions: [receive]

  - id: tx-history
    name: Token history and transaction details
    description: The user opens a token to see its balance and transactions, and opens a transaction to see its details.
    status: in-scope
    screens: [MainScreen, TokenDetail]
    files:
      - src/screens/MainScreen.js
      - src/screens/TokenDetail.js
      - src/components/TxDetailsModal.js
      - src/components/TransactionStatusLabel.js
      - src/sagas/tokens.js
    flags: []
    links:
      - { to: token-metadata, reason: History rows and details show token metadata such as the NFT flag }
      - { to: shielded, reason: On the shielded testnet balances split into public and private and details show the privacy fee }
    introduces: []
    actions: [history]

  - id: dashboard
    name: Home token list
    description: The home tab lists the registered tokens with their balances and opens a token's history.
    status: in-scope
    screens: [Home, Main, Dashboard]
    files:
      - src/screens/Dashboard.js
      - src/components/TokenSelect.js
    flags: []
    links:
      - { to: token-register, reason: Shows only registered tokens }
      - { to: token-import, reason: Shows the banner to import tokens found in the wallet }
    introduces: []
    actions: [history] # history starts on the home token list

  - id: shielded
    name: Private balance and unlock
    description: On the shielded testnet, balances split into public and private parts, and the private part is unlocked to be seen and spent.
    status: in-scope
    screens: []
    files:
      - src/sagas/shielded.js
      - src/sagas/shieldedProvider.js
      - src/shielded/balance.js
      - src/shielded/capability.js
      - src/shielded/cryptoProvider.js
      - src/shielded/gating.js
      - src/shielded/unlock.js
      - src/shielded/unlockState.js
      - src/components/Shielded/ShieldedBalanceSplit.js
      - src/components/Shielded/ShieldedUnlockAction.js
      - src/components/AuditUnblindingRows.js
    flags: [shielded-outputs]
    links:
      - { to: wallet-service, reason: On the wallet service the private balance comes from the service and needs shielded capability }
      - { to: network-settings, reason: The shielded UI only exists on the shielded testnet }
      - { to: feature-flags, reason: The shielded UI turns on or off live with its flag }
    introduces: ['private-balance:locked', 'private-balance:broken-key']
    # Exercised only on the shielded networks, so it owns no whole action; it reaches them via its values.
    actions: []

  - id: wallet-service
    name: Wallet service or fullnode facade
    description: The wallet talks either to the wallet service or directly to a fullnode; the choice changes how balances load and transactions are built.
    status: in-scope
    screens: []
    files:
      - src/sagas/wallet.js
    flags: [wallet-service]
    links:
      - { to: wallet-load, reason: A failed wallet-service start falls back to the fullnode and ignores the flag for 24 hours }
      - { to: network-settings, reason: An empty wallet-service URL in the network settings forces the fullnode facade }
      - { to: feature-flags, reason: Turning the wallet-service flag off mid-session reloads the wallet }
    # Every action runs on one facade; the wallet-service one is reached via its value.
    introduces: ['facade:wallet-service']
    actions: []

  - id: network-settings
    name: Network settings
    description: The user switches the wallet to another network (testnet, shielded testnet or a custom one), which restarts the wallet.
    status: in-scope
    screens: [NetworkSettingsFlowStack, NetworkSettingsDisclaimer, NetworkPreSettings, CustomNetworkSettings]
    files:
      - src/screens/NetworkSettings/
      - src/components/NetworkSettings/
      - src/sagas/networkSettings.js
      - src/shielded/preset.js
    flags: [network-settings, shielded-outputs-network, wallet-service]
    links:
      - { to: wallet-load, reason: Saving a network restarts the wallet }
    # The default network is the public testnet; the others are reached only through these settings.
    introduces: ['network:testnet-shielded', 'network:local-privnet']
    actions: []

  - id: wallet-create
    name: Create wallet
    description: A new user creates a wallet, writes down the 24 words, confirms some of them and picks a PIN.
    status: in-scope
    screens: [Init, WelcomeScreen, InitialScreen, NewWordsScreen, BackupWords, ChoosePinScreen]
    files:
      - src/screens/InitWallet.js
      - src/screens/BackupWords.js
      - src/screens/ChoosePinScreen.js
    flags: []
    links:
      - { to: pin-setup, reason: The wallet is finished by choosing a PIN }
      - { to: wallet-load, reason: The new wallet starts and loads right after }
    introduces: []
    actions: []

  - id: wallet-import
    name: Import wallet from words
    description: A user restores an existing wallet by typing its 24 words and picking a PIN.
    status: in-scope
    screens: [LoadWordsScreen, ChoosePinScreen]
    files:
      - src/screens/InitWallet.js
      - src/screens/ChoosePinScreen.js
    flags: []
    links:
      - { to: pin-setup, reason: The import is finished by choosing a PIN }
      - { to: wallet-load, reason: The imported wallet starts and loads its history }
      - { to: address-mode, reason: An imported wallet with transactions past the first address is moved to multi-address mode }
    introduces: []
    actions: []

  - id: passkey-onboarding
    name: Passkey wallet
    description: A user creates or opens a wallet with a passkey instead of words and a PIN.
    status: in-scope
    screens: [InitialScreen]
    files:
      - src/components/PasskeyOnboardingButton.js
      - src/passkey/
    flags: [passkey-onboarding, wallet-service]
    links:
      - { to: wallet-load, reason: The passkey wallet starts right after the ceremony }
      - { to: wallet-service, reason: A passkey wallet registers itself with the wallet service }
    # Passkey authorization and passkey-derived shielded keys reach the actions via axis (wallet = passkey).
    introduces: ['wallet:passkey']
    actions: []

  - id: pin-unlock
    name: PIN confirmation
    description: The app asks for the PIN before sensitive actions such as sending, creating a token or exporting keys.
    status: in-scope
    screens: [PinScreen]
    files:
      - src/screens/PinScreen.js
      - src/components/PinInput.js
      - src/components/NumPad.js
    flags: []
    links:
      - { to: biometrics, reason: With biometrics on the PIN screen may be replaced by a fingerprint or face check }
    introduces: []
    actions: [send, create-token]

  - id: token-register
    name: Register token
    description: The user adds a custom token to the wallet by scanning or pasting its configuration string.
    status: in-scope
    screens: [RegisterOptions, RegisterToken, RegisterTokenScreen, RegisterTokenManual]
    files:
      - src/screens/RegisterOptionsScreen.js
      - src/screens/RegisterToken.js
      - src/screens/RegisterTokenManual.js
      - src/utils/tokens.js
    flags: [reown, nano-contract]
    links:
      - { to: camera-permission, reason: Scanning the configuration needs the camera permission }
    introduces: []
    actions: []

  - id: feature-flags
    name: Remote feature flags
    description: The app reads feature flags from Unleash for its device and network every 15 seconds and turns features on or off.
    status: in-scope
    screens: []
    files:
      - src/sagas/featureToggle.js
    flags: []
    links:
      - { to: network-settings, reason: Flags are read again for the network the wallet is on }
    introduces: []
    actions: []

  - id: reset-wallet
    name: Reset wallet
    description: The user erases the wallet from the device and goes back to the welcome screen.
    status: in-scope
    screens: [ResetWallet]
    files:
      - src/screens/ResetWallet.js
    flags: []
    links:
      - { to: wallet-create, reason: A reset ends on the onboarding screens of wallet creation }
    introduces: []
    actions: []

  # Out of scope for v1 (inventory only)
  - id: wallet-load
    name: Wallet start and history load
    description: The wallet starts, loads its history, and shows an error screen if it fails.
    status: out-of-scope
    screens: [Decide, App]
    files:
      - src/screens/LoadHistoryScreen.js
      - src/screens/LoadWalletErrorScreen.js
      - src/screens/DecideStackScreen.js
    flags: [wallet-service]
    links:
      - { to: wallet-service, reason: A failed wallet-service start falls back to the fullnode }

  - id: pin-setup
    name: Choose or change PIN
    description: The user picks a PIN during onboarding or changes it later in settings.
    status: out-of-scope
    screens: [ChoosePinScreen, ChangePin]
    files:
      - src/screens/ChangePin.js
    flags: []

  - id: biometrics
    name: Biometric unlock
    description: The user turns fingerprint or face unlock on or off in the security settings.
    status: out-of-scope
